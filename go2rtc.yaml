# go2rtc configuration for Smart CCTV
# Cameras are managed dynamically via the Node.js API server.
# Port 1984 and 8554 are bound strictly to 127.0.0.1 via docker-compose.yml.

api:
  listen: ":1984"
  origin: ""

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"
  candidates:
    - stun:stun.l.google.com:19302

log:
  level: info
