services:
  # ============================================
  # go2rtc - Lightweight RTSP to WebRTC/HLS proxy
  # Only go2rtc runs in Docker. API & RTSP ports are bound to 127.0.0.1
  # so external users cannot bypass Node.js authentication or read RTSP credentials.
  # ============================================
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: smart_cctv_stream
    restart: unless-stopped
    ports:
      - "127.0.0.1:1984:1984"   # Web UI + API (Localhost only - proxied via Node.js)
      - "127.0.0.1:8554:8554"   # RTSP Relay (Localhost only - used by local FFmpeg)
      - "8555:8555/tcp"         # WebRTC media (TCP)
      - "8555:8555/udp"         # WebRTC media (UDP)
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
